services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - FA_LLM_PROVIDER=${FA_LLM_PROVIDER:-none}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
  web:
    build: { context: ., dockerfile: frontend/Dockerfile, args: { API_URL: "http://api:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
