# Media registry. One entry per camera view per test.
# kind: footage | test_pattern. Test patterns are synthetic shapes for pipeline tests;
# they are never shown as flames or NASA footage. Real footage: drop files in
# data/raw/<dataset>/media/ and add an entry with kind: footage.
