# Surrogate models, learned only from loaded data. One entry per model.
# type: gp_classifier | gp_regressor | gbr_quantile
models:
  droplet_burn:
    dataset: flex
    label: Droplet — sustained burning vs extinction
    type: gp_classifier
    target: burned
    features: [o2_frac, pressure_kpa, d0_mm, co2_frac, he_frac, fuel]
    group: campaign
  droplet_k:
    dataset: flex
    label: Droplet — burning-rate constant K
    type: gp_regressor
    target: burn_rate_k_mm2_s
    features: [o2_frac, pressure_kpa, d0_mm, co2_frac, he_frac, fuel]
    group: campaign
  droplet_dext:
    dataset: flex
    label: Droplet — extinction diameter
    type: gp_regressor
    target: extinction_d_mm
    features: [o2_frac, pressure_kpa, d0_mm, co2_frac, he_frac, fuel]
    group: campaign
    only_when: { burned: 0 }
  # No solid-material model: the real solid tables (BASS-II, SAFFIRE) record no pressure, and BASS-II
  # has no burned / went-out column. The synthetic fixture that trained solid_burn / solid_spread is off.
  gas_sustain:
    dataset: cfig_normal
    label: Gas flame (CFI-G) — still burning vs self-extinguished
    type: gp_classifier
    target: burned
    features: [o2_frac, pressure_kpa, fuel_flow_mg_s, fuel]
    group: campaign

applicability:
  k_neighbors: 5
  # thresholds are percentiles of the training set's own leave-one-out kNN distance
  inside_percentile: 95
  edge_multiplier: 2.0
  nearest_tests: 6
  close_conditions_distance: 1.0   # standardized units; used by the Answer Engine grade
  morph_max_distance: 1.5          # Image Lab: switch to a real test only within this distance
