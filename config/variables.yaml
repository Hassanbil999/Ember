# Canonical variables. Every adapter maps raw columns onto these names.
# role: condition | outcome | id | meta
# kind: number | category | date | bool
variables:
  o2_frac:
    label: Oxygen fraction
    short: O₂
    unit: "mol/mol"
    display_unit: "%"
    display_scale: 100
    kind: number
    role: condition
    description: Oxygen mole fraction of the ambient atmosphere (0–1).
    synonyms: [oxygen, o2, "o₂", oxygen concentration, oxygen fraction, oxygen percent, ox]
    valid_range: [0.0, 1.0]
    plausible_range: [0.05, 1.0]
  pressure_kpa:
    label: Total pressure
    short: P
    unit: kPa
    kind: number
    role: condition
    description: Total ambient pressure.
    synonyms: [pressure, total pressure, ambient pressure, psi, atm, kpa, bar]
    valid_range: [0.0001, 1000]
    plausible_range: [5, 600]      # PSI droplet experiments (CFI) ran up to 5 atm (507 kPa)
  o2_pp_kpa:
    label: O₂ partial pressure
    short: pO₂
    unit: kPa
    kind: number
    role: condition
    derived: "o2_frac * pressure_kpa"
    description: Oxygen partial pressure = O₂ mole fraction × total pressure.
    synonyms: [partial pressure, oxygen partial pressure, ppo2, po2]
    valid_range: [0, 1000]
  n2_frac:
    label: Nitrogen fraction
    unit: "mol/mol"
    display_unit: "%"
    display_scale: 100
    kind: number
    role: condition
    description: Nitrogen mole fraction of the ambient atmosphere.
    synonyms: [nitrogen fraction]
    valid_range: [0.0, 1.0]
  co2_frac:
    label: Carbon dioxide fraction
    unit: "mol/mol"
    display_unit: "%"
    display_scale: 100
    kind: number
    role: condition
    description: Carbon dioxide mole fraction of the ambient atmosphere.
    synonyms: [co2 fraction, carbon dioxide fraction]
    valid_range: [0.0, 1.0]
  he_frac:
    label: Helium fraction
    unit: "mol/mol"
    display_unit: "%"
    display_scale: 100
    kind: number
    role: condition
    description: Helium mole fraction of the ambient atmosphere.
    synonyms: [helium fraction]
    valid_range: [0.0, 1.0]
  flow_cm_s:
    label: Airflow speed
    short: U
    unit: cm/s
    kind: number
    role: condition
    description: Imposed or ventilation airflow speed past the sample (replaces buoyancy in microgravity).
    synonyms: [flow, airflow, flow speed, ventilation, velocity, forced flow, opposed flow]
    valid_range: [0, 1000]
    plausible_range: [0, 100]
  d0_mm:
    label: Initial droplet diameter
    short: d₀
    unit: mm
    kind: number
    role: condition
    description: Droplet diameter at ignition.
    synonyms: [droplet diameter, initial diameter, droplet size, d0]
    valid_range: [0.1, 20]
    plausible_range: [0.5, 6]
  thickness_mm:
    label: Sample thickness
    short: δ
    unit: mm
    kind: number
    role: condition
    description: Thickness of the solid fuel sample.
    synonyms: [thickness, sample thickness, sample size]
    valid_range: [0.01, 50]
    plausible_range: [0.02, 15]
  diameter_mm:
    label: Sample diameter
    short: ⌀
    unit: mm
    kind: number
    role: condition
    description: Diameter of a rod or sphere sample.
    synonyms: [diameter, rod diameter, sphere diameter, rod, sphere]
    valid_range: [0.1, 200]
  sample_shape:
    label: Sample shape
    kind: category
    role: condition
    description: Form of the solid sample (thin film, slab, rod, sphere, fabric, candle).
    synonyms: [shape, film, slab, rod, sphere, fabric, candle, cylinder, sheet]
  flow_direction:
    label: Flow direction
    kind: category
    role: condition
    description: Whether the airflow pushes the flame along the sample (concurrent) or against its spread (opposed).
    synonyms: [concurrent, opposed, flow direction, wind-aided, opposed flow]
  gravity_g:
    label: Gravity
    short: gravity
    unit: "g"
    kind: number
    role: condition
    # Stored as a regime code and always displayed as a regime name (backend/record.py gravity_label).
    description: Gravity regime. Code 0 means microgravity (about a millionth of Earth gravity on the ISS, not zero); 1 means Earth.
    synonyms: [gravity, microgravity, "1g", "normal gravity", "μg", "ug", lunar, martian, partial gravity]
    valid_range: [0, 1.5]
  diluent:
    label: Inert diluent
    short: dil.
    kind: category
    role: condition
    description: Inert gas that makes up the non-oxygen fraction.
    synonyms: [diluent, inert, nitrogen, n2, helium, he, carbon dioxide, co2]
    categories: [N2, CO2, He]
  fuel:
    label: Fuel
    kind: category
    role: condition
    description: Fuel burned in the test (the droplet's liquid, or the gas fed to a burner).
    synonyms: [fuel, heptane, n-heptane, methanol, decane, n-decane, ethanol, ethylene, propane, butane, ethane, methane, gas flame]
  fuel_flow_mg_s:
    label: Fuel flow rate
    short: ṁ
    unit: mg/s
    kind: number
    role: condition
    description: Mass flow of fuel fed to a gas flame (spherical burner); more fuel means a larger flame.
    synonyms: [fuel flow, fuel flow rate, mass flow, burner flow]
    valid_range: [0, 100]
  burner_mm:
    label: Burner or nozzle size
    short: burner
    unit: mm
    kind: number
    role: condition
    description: Diameter of the burner or fuel nozzle that fed a gas flame.
    synonyms: [burner, nozzle, burner size, nozzle diameter]
    valid_range: [0.05, 200]
  oxidizer_o2_frac:
    label: Oxygen in the oxidizer stream
    unit: "mol/mol"
    display_unit: "%"
    display_scale: 100
    kind: number
    role: condition
    description: For inverse flames (oxygen blown into fuel), the oxygen fraction of the stream leaving the burner. It is not the oxygen in the surrounding air.
    synonyms: [oxidizer, inverse flame, oxidizer oxygen]
    valid_range: [0.0, 1.0]
  ambient_fuel_frac:
    label: Fuel in the surrounding gas
    unit: "mol/mol"
    display_unit: "%"
    display_scale: 100
    kind: number
    role: condition
    description: For inverse flames, the fuel fraction of the gas around the burner.
    synonyms: [ambient fuel, fuel fraction]
    valid_range: [0.0, 1.0]
  flames_ignited:
    label: Flames ignited that day
    unit: ""
    kind: number
    role: meta
    description: Number of flames ignited on that test day, as a daily summary table reports it.
    synonyms: [flames ignited, ignitions]
    valid_range: [0, 1000]
  heater_ratio:
    label: Heater setting (Rt/R0)
    short: Rt/R0
    unit: ""
    kind: number
    role: condition
    description: The heater setting of each smoke run, as the PSI table writes it (Rt/R0). The table does not convert it to a temperature, so neither does this atlas.
    synonyms: [heater, rt/r0, heating temperature, temperature setting]
    valid_range: [0.5, 3]
  heat_duration_s:
    label: Heating time
    unit: s
    kind: number
    role: condition
    description: How long the sample was heated to make smoke.
    synonyms: [heating time, heating duration, duration]
    valid_range: [0, 3600]
  smoke_aging_s:
    label: Smoke aging time
    unit: s
    kind: number
    role: condition
    description: How long the smoke was held before it was measured (smoke particles grow as they age).
    synonyms: [aging, smoke aging, aged smoke, aging time]
    valid_range: [0, 10000]
  mass_loss_rate_mg_min:
    label: Sample weight-loss rate
    unit: mg/min
    kind: number
    role: condition
    description: How fast the heated sample lost mass while giving off smoke.
    synonyms: [weight loss, mass loss, weight loss rate]
    valid_range: [0, 1000]
  notes:
    label: Test note
    kind: category
    role: meta
    description: The test's own description or note from the PSI table.
    synonyms: [note, description, comment]
  material:
    label: Material
    kind: category
    role: condition
    description: Solid material tested.
    synonyms: [material, pmma, acrylic, cotton, fiberglass, nomex, fabric, acetal, delrin]
  burned:
    label: Sustained burning
    short: burn
    kind: bool
    role: outcome
    description: 1 if a flame was sustained (burned to completion / spread), 0 if extinguished or no ignition.
    synonyms: [burn, burned, burning, extinction, extinguished, flammable, flammability, quench]
  burn_rate_k_mm2_s:
    label: Burning-rate constant K
    short: K
    unit: "mm²/s"
    kind: number
    role: outcome
    description: Slope of the d² law (d² = d₀² − K·t) during quasi-steady burning.
    synonyms: [burning rate, burning rate constant, k, d2 law, d-squared]
    valid_range: [0, 5]
    plausible_range: [0.1, 2]
  extinction_d_mm:
    label: Extinction diameter
    short: d_ext
    unit: mm
    kind: number
    role: outcome
    description: Droplet diameter at the moment of flame extinction.
    synonyms: [extinction diameter]
    valid_range: [0, 20]
  burn_time_s:
    label: Burn time
    unit: s
    kind: number
    role: outcome
    description: Time from ignition to the end of burning.
    synonyms: [burn time, burning time]
    valid_range: [0, 600]
  test_end:
    label: How the test ended
    kind: category
    role: outcome
    description: Completion (burned out), Extinction (flame went out with fuel left) or Disruption (the droplet broke apart).
    synonyms: [test end, disruption, completion]
  spread_rate_mm_s:
    label: Flame spread rate
    short: V_f
    unit: mm/s
    kind: number
    role: outcome
    description: Speed of the flame leading edge over the solid surface.
    synonyms: [spread rate, flame spread, spread, propagation]
    valid_range: [0, 200]
  mission_date:
    label: Test date
    kind: date
    role: meta
    description: Date of the test.
    synonyms: [date, year, mission date, time]
  campaign:
    label: Campaign
    kind: category
    role: meta
    description: Test campaign / increment; used as the group for cross-validation.
    synonyms: [campaign, increment, series]
