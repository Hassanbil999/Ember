# Dataset registry. `make ingest` runs every entry with enabled: true.
# To add a dataset: drop files in data/raw/<id>/, add an entry here, and
# (only if the shape is new) write backend/adapters/<adapter>.py. See docs/ADDING_A_DATASET.md.

datasets:
  flex:
    title: FLEX droplet combustion tests (NASA PSI-69 experimental table)
    adapter: flex_psi
    enabled: true
    demo: false
    investigations: [FLEX]
    files: ["PSI-69_Experimental table_FLEX.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-69. See the PSI terms of use."
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    # "Test", "Campaign", "Investigation", "Diluent" and "Outcome" are helper columns built by the adapter
    # from the file's own columns; they are recorded as derived, never as source values.
    columns:
      "Test": test_id
      "Campaign": campaign
      "Investigation": investigation_id
      "Fuel": fuel
      "O initial ambient composition; mole fraction": o2_frac
      "N initial ambient composition; mole fraction": n2_frac
      "CO initial ambient composition; mole fraction": co2_frac
      "He initial ambient composition; mole fraction": he_frac
      "Diluent": diluent
      "Ambient pressure; mmHg": pressure_kpa
      "Droplet initial diameter; mm": d0_mm
      "Test end": test_end
      "Outcome": burned
      "Burning rate; mm": burn_rate_k_mm2_s
      "Visible flame extinction diameter; mm": extinction_d_mm
      "Burn time; s": burn_time_s
      "Test Date": mission_date
    units: { "Ambient pressure; mmHg": mmHg, "Droplet initial diameter; mm": mm, "Visible flame extinction diameter; mm": mm,
             "Burning rate; mm": "mm^2/s", "Burn time; s": s }
    constants: { gravity_g: 0.0, flow_cm_s: 0.0 }
    # Disruption (the droplet broke apart) decides nothing about burning vs extinction, so it maps to no outcome.
    outcome_map: { "completion": 1, "extinction": 0 }

  cfig_normal:
    title: CFI-G gas flames (NASA PSI-159 experimental table, normal flames)
    adapter: psi_gas_flames
    enabled: true
    demo: false
    investigations: [CFI-G]
    files: ["PSI-159_Experimental table_CFI-G_Normal Flames.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-159. See the PSI terms of use."
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    id_prefix: "CFIG-"
    # Gas fed through a spherical porous burner into a closed chamber of known O2 and pressure (ACME hardware, ISS).
    # "Test id", "Campaign", "Date", "Investigation", "Outcome" and "Test end" are helper columns built by the
    # adapter from the file's own columns; they are recorded as derived.
    columns:
      "Test id": test_id
      "Campaign": campaign
      "Investigation": investigation_id
      "Fuel": fuel
      "XO2 before test": o2_frac
      "approx p (bar)": pressure_kpa
      "mHC (mg/s)": fuel_flow_mg_s
      "burn time (sec)": burn_time_s
      "Outcome": burned
      "Test end": test_end
      "Date": mission_date
    units: { "approx p (bar)": bar, "mHC (mg/s)": "mg/s" }
    constants: { gravity_g: 0.0 }
    outcome:
      column: "Self-ext or flow term"
      ignition_column: "Hot ignition"
      cool_column: "Cool flame?"
    # FT: the flame was still burning when the fuel flow was stopped (sustained). SE: it went out by itself.
    # "-" (no hot ignition) decides nothing about sustained burning and maps to no outcome.
    outcome_map: { "ft": 1, "se": 0 }

  flame_design_normal:
    title: ACME Flame Design gas flames (NASA PSI-10 experimental table, normal flames)
    adapter: psi_gas_flames
    enabled: true
    demo: false
    investigations: [ACME]
    files: ["PSI-10_Experimental table_Flame Design_Normal Flame.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-10. See the PSI terms of use."
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    id_prefix: "FD-"
    # This table records conditions only; it has no outcome column, so nothing is claimed about burning.
    # "RAMP"/"RAMPED" fuel cells (flow changed during the test) are read as no single value.
    columns:
      "Test id": test_id
      "Campaign": campaign
      "Investigation": investigation_id
      "Fuel": fuel
      "XO2 (init)": o2_frac
      "pinit (atm)": pressure_kpa
      "mfuel (mg/s)": fuel_flow_mg_s
      "Date": mission_date
    units: { "pinit (atm)": atm, "mfuel (mg/s)": "mg/s" }
    constants: { gravity_g: 0.0 }

  bass2:
    title: BASS-II solid-material tests (NASA PSI-25 experimental table)
    adapter: psi_bass2
    enabled: true
    demo: false
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    investigations: [BASS-II]
    files: ["PSI-25_Experimental table_BASS-II.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-25. See the PSI terms of use."
    # Every column below except O2 and Date is a helper the adapter reads from free text (sample description,
    # test notes); each is recorded as derived with its source text. The table has no burned/went-out column.
    columns:
      "Test id": test_id
      "Campaign": campaign
      "Investigation": investigation_id
      "Material": material
      "Shape": sample_shape
      "Thickness": thickness_mm
      "Diameter": diameter_mm
      "Flow direction": flow_direction
      "O2": o2_frac
      "Test end": test_end
      "Date": mission_date
    units: { "O2": "%" }
    constants: { gravity_g: 0.0 }

  bass:
    title: BASS solid-material run list (NASA PSI-26 experimental table)
    adapter: psi_bass
    enabled: true
    demo: false
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    investigations: [BASS]
    files: ["PSI-26_Experimental table_BASS.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-26. See the PSI terms of use."
    # The PSI table lists what was burned and when; it records no oxygen level, airflow or outcome.
    columns:
      "Test id": test_id
      "Investigation": investigation_id
      "Material": material
      "Shape": sample_shape
      "Diameter": diameter_mm
      "Flow direction": flow_direction
      "Test end": test_end
      "Date": mission_date
    constants: { gravity_g: 0.0 }

  saffire1:
    title: SAFFIRE-1 large-sample fire (NASA PSI-98 experimental table)
    adapter: psi_saffire
    enabled: true
    demo: false
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    investigations: [Saffire-I]
    files: ["PSI-98_Experimental table_SAFFIRE-1.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-98. See the PSI terms of use."
    microgravity_label: "Microgravity (Cygnus vehicle, after leaving the ISS)"
    id_prefix: SAF1
    columns: &saffire_cols
      "Test id": test_id
      "Campaign": campaign
      "Investigation": investigation_id
      "Material": material
      "Shape": sample_shape
      "Thickness": thickness_mm
      "Airflow": flow_cm_s
      "Flow direction": flow_direction
      "O2": o2_frac
      "Gravity": gravity_g
      "Burn time": burn_time_s
      "Burned": burned
      "Test end": test_end
      "Spread rate": spread_rate_mm_s
    outcome_map: { "1": 1, "0": 0 }

  saffire2:
    title: SAFFIRE-2 material fires, flight and 1g ground (NASA PSI-99 experimental table)
    adapter: psi_saffire
    enabled: true
    demo: false
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    investigations: [Saffire-II]
    files: ["PSI-99_Experimental table_SAFFIRE-2.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-99. See the PSI terms of use."
    microgravity_label: "Microgravity (Cygnus vehicle, after leaving the ISS)"
    id_prefix: SAF2
    columns: *saffire_cols
    outcome_map: { "1": 1, "0": 0 }

  saffire3:
    title: SAFFIRE-3 large-sample fire (NASA PSI-100 experimental table)
    adapter: psi_saffire
    enabled: true
    demo: false
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    investigations: [Saffire-III]
    files: ["PSI-100_Experimental table_SAFFIRE-3.csv"]
    license: "NASA Physical Sciences Informatics (PSI), investigation PSI-100. See the PSI terms of use."
    microgravity_label: "Microgravity (Cygnus vehicle, after leaving the ISS)"
    id_prefix: SAF3
    columns: *saffire_cols
    outcome_map: { "1": 1, "0": 0 }

  flex_demo:        # synthetic stand-in used before the real table was loaded; kept for the adapter tests
    title: Droplet combustion tests (FLEX-shaped demo fixture)
    adapter: flex_droplets
    enabled: false
    demo: true
    investigations: [FLEX, FLEX-2]
    files: [flex_droplet_tests.csv]
    license: "Demo fixture (synthetic) — CC0. Not NASA data."
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    # raw column -> canonical variable (units are parsed from the cell or header)
    columns:
      "Test ID": test_id
      "Campaign": campaign
      "Investigation": investigation_id
      "Fuel": fuel
      "O2": o2_frac
      "Diluent": diluent
      "Pressure": pressure_kpa
      "D0 (mm)": d0_mm
      "Outcome": burned
      "K (mm^2/s)": burn_rate_k_mm2_s
      "Ext. D (mm)": extinction_d_mm
      "Date": mission_date
    constants: { gravity_g: 0.0, flow_cm_s: 0.0 }
    outcome_map: { "burned": 1, "burned to completion": 1, "flame extinction": 0, "extinguished": 0, "no ignition": 0 }

  bass2_demo:        # synthetic stand-in used before the real BASS-II table was loaded; kept for the adapter tests
    title: Solid-material flammability tests (BASS-II-shaped demo fixture)
    adapter: bass2_solids
    enabled: false
    demo: true
    investigations: [BASS-II]
    files: [bass2_flammability.xlsx]
    sheet: Tests
    license: "Demo fixture (synthetic) — CC0. Not NASA data."
    source_urls: ["https://psi.nasa.gov"]
    doi: null
    columns:
      "Sample": test_id
      "Campaign": campaign
      "Material": material
      "Thickness [mm]": thickness_mm
      "O2 mole frac": o2_frac
      "Total P [kPa]": pressure_kpa
      "Flow [mm/s]": flow_cm_s
      "Gravity": gravity_g
      "Result": burned
      "Spread rate [mm/s]": spread_rate_mm_s
      "Run date": mission_date
    units: { "Flow [mm/s]": "mm/s", "Total P [kPa]": kPa }
    outcome_map: { "burned": 1, "spread": 1, "extinguished": 0, "self-extinguished": 0, "no ignition": 0 }

  reports:
    title: Reports and notes (PDF)
    adapter: pdf_reports
    enabled: true
    demo: true
    # The synthetic droplet and solid reports are left out: they would contradict the real tables.
    # What remains are two context notes compiled by the platform authors from the challenge brief;
    # they are not NASA documents and keep the "demo" label until NASA documents replace them.
    files: [detection_suppression_notes.pdf, fire_safety_context.pdf]
    license: "Compiled context notes (platform authors, not NASA) — CC0."

# Validation rules, applied to every tabular dataset after normalization.
# Flag, never silently fix. action: flag | exclude
validation:
  - id: impossible_value
    invalid: true              # the raw value failed the physical check in core/units.py, before conversion
    action: exclude
    reason: "Impossible value in the source. It is shown as flagged, never converted and never used in a calculation."
  - id: implausible
    plausible: true            # checks each variable's plausible_range from variables.yaml
    action: flag
    reason: "Value outside the plausible range for this variable."
  - id: duplicate
    duplicate_on: [test_id]
    action: exclude
    reason: "Duplicate test id; first occurrence kept."
  - id: missing_outcome
    missing: burned
    action: flag
    reason: "No burn-or-extinguish outcome for this test; the row is kept for its conditions but not used in outcome models."
  - id: rate_without_burn
    when: "burned == 0 and spread_rate_mm_s > 0"      # droplets legitimately report a burning rate before extinction
    action: flag
    reason: "A flame spread rate is reported for a sample marked extinguished: check the source."
  - id: fractions_do_not_sum
    when: "abs(o2_frac + n2_frac + co2_frac + he_frac - 1) > 0.015"
    action: flag
    reason: "The four gas fractions in the source do not add up to 100 %."
  - id: extinction_larger_than_start
    when: "extinction_d_mm > d0_mm"
    action: flag
    reason: "The extinction diameter is larger than the starting diameter: check the source."
